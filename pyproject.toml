[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lingyi-agent-memory"
version = "0.1.0"
description = "Self-learning agent memory system for Kylin V11 OS Agent (job-package cut)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "LingYi Project" }
]
dependencies = [
    "paramiko>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kylin_v11_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"